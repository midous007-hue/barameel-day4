<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>BARAMEEL RUN — Puzzle Piece</title><link rel="stylesheet" href="./styles.css"></head>
<body><main class="puzzle-stage" style="--ratio:.5811;--ar:1190/2048"><img class="puzzle-art" src="./assets/screen06-puzzle.png" alt="Puzzle progress">
<div id="collectionNo" class="puzzle-input field-one"></div><div id="collectionName" class="puzzle-input field-two"></div>
<div id="grid" class="puzzle-grid"></div><div id="pieceInfo" class="puzzle-input field-three"></div><div id="progress" class="progress-grid"></div>
<button id="back" class="puzzle-back" aria-label="Back"></button><button id="nice" class="puzzle-nice" aria-label="Nice one"></button><div id="rewardGlow"></div></main>
<script src="./app.js"></script><script>
const params=new URLSearchParams(location.search),collection=params.get("collection")||"collection01",piece=Number(params.get("piece")||0);
const cfg={number:"01",name:"ALEXANDRIA NIGHTS",total:9};
const no=document.getElementById("collectionNo"),name=document.getElementById("collectionName"),info=document.getElementById("pieceInfo"),grid=document.getElementById("grid"),progress=document.getElementById("progress");
no.textContent=`COLLECTION ${cfg.number}`;name.textContent=cfg.name;
const collected=BR.state.collected[collection]||[];
info.textContent=piece?`PIECE ${String(piece).padStart(2,"0")}  •  +100 POINTS`:`${collected.length}/9 PIECES`;
const slots=[
 [37.0,40.0,16.2,8.8],[53.0,40.0,16.2,8.8],[69.0,40.0,16.2,8.8],
 [37.0,49.0,16.2,8.8],[53.0,49.0,16.2,8.8],[69.0,49.0,16.2,8.8],
 [37.0,58.0,16.2,8.8],[53.0,58.0,16.2,8.8],[69.0,58.0,16.2,8.8]
];
for(let i=1;i<=9;i++){const p=String(i).padStart(2,"0"),d=document.createElement("div");d.className="puzzle-piece";const z=slots[i-1];d.style.cssText=`left:${z[0]}%;top:${z[1]}%;width:${z[2]}%;height:${z[3]}%`;if(collected.includes(p)){const im=document.createElement("img");im.src=`./assets/collections/${collection}/pieces/${collection}-piece-${p}.png`;d.appendChild(im);}grid.appendChild(d);}
for(let i=1;i<=7;i++){const d=document.createElement("div");d.className="progress-cell"+(i<=Math.min(7,collected.length)?" on":"");progress.appendChild(d);}
document.getElementById("back").onclick=()=>{BR.play("back");BR.go("screen05.html")};
document.getElementById("nice").onclick=()=>{BR.play("confirm");BR.go("screen04.html")};
const tr=JSON.parse(localStorage.getItem("barameelRewardTransition")||"null");const elapsed=tr?.startedAt?Math.max(0,(Date.now()-tr.startedAt)/1000):0;
const audio=BR.playRewardFrom(Math.min(elapsed,1.5));
document.getElementById("rewardGlow").classList.add("on");
window.addEventListener("pointerdown",()=>{if(audio.paused)BR.playRewardFrom(Math.min(elapsed,1.5));},{once:true,passive:true});
setTimeout(()=>document.getElementById("rewardGlow").classList.remove("on"),700);
</script></body></html>
