<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>BARAMEEL RUN — Choose Your Runner</title><link rel="stylesheet" href="./styles.css"></head>
<body><main class="stage" style="--ratio:.5628;--ar:941/1672"><img id="art" class="base art-ready" alt="Choose your runner"><div id="transition" class="art-transition"></div><div id="hotspots"></div></main>
<script src="./app.js"></script><script>
const art=document.getElementById("art"),transition=document.getElementById("transition");
const chars=["rookie","skater","brona","racer","chiller","dreamer"];
const files=Object.fromEntries(chars.map(c=>[c,`./assets/screen02-${c}.png`]));
function show(c,playSound=true){
  BR.setRunner(c);
  const next=files[c];
  transition.classList.add("on");
  const im=new Image(); im.onload=()=>{art.src=next;art.decode?.().catch(()=>{});requestAnimationFrame(()=>transition.classList.remove("on"));}; im.src=next;
  if(playSound)BR.play("select");
}
show(BR.selected(),false);
BR.preloadAll(chars.map(c=>files[c]));
const zones=[
["rookie",1.5,24.0,15.3,18.4],["skater",17.5,24.0,15.4,18.4],["brona",33.5,24.0,16.5,18.4],
["racer",50.3,24.0,15.4,18.4],["chiller",66.4,24.0,15.5,18.4],["dreamer",82.4,24.0,16.0,18.4]
];
zones.forEach(([c,l,t,w,h])=>{const b=document.createElement("button");b.className="hotspot";b.style.cssText=`left:${l}%;top:${t}%;width:${w}%;height:${h}%`;b.setAttribute("aria-label",BR.RUNNER_NAMES[c]);b.onclick=()=>show(c,true);document.getElementById("hotspots").appendChild(b);});
const back=document.createElement("button");back.className="hotspot back-hotspot";back.style.cssText="left:2.4%;top:2.0%;width:19.0%;height:5.2%";back.onclick=()=>{BR.play("back");BR.go("index.html")};document.getElementById("hotspots").appendChild(back);
const choose=document.createElement("button");choose.className="hotspot";choose.style.cssText="left:50.6%;top:74.7%;width:45.8%;height:9.2%";choose.setAttribute("aria-label","Choose runner");choose.onclick=()=>{BR.play("confirm");BR.go("screen03.html")};document.getElementById("hotspots").appendChild(choose);
</script></body></html>
