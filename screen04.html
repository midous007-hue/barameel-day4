<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>BARAMEEL RUN — Run</title><link rel="stylesheet" href="./styles.css"></head>
<body><main class="stage dashboard-stage" style="--ratio:.5714;--ar:948/1659"><img id="art" class="base" alt="BARAMEEL RUN run mode" decoding="async" fetchpriority="high"><div id="stats" aria-live="polite">
<div id="statPoints" class="dashboard-stat points-stat"></div>
<div id="statMarks" class="dashboard-stat marks-stat"></div>
<div id="statWeek" class="dashboard-stat week-stat"></div>
<div id="checkpointDots" class="checkpoint-dots"></div>
</div><div id="hotspots"></div></main>
<script src="./app.js"></script><script>
const c=BR.selected();
const art=document.getElementById("art");
art.src=`./assets/screen04-${c}.png`;
const hs=document.getElementById("hotspots");
function add(css,fn,cls=""){const b=document.createElement("button");b.className="hotspot "+cls;b.style.cssText=css;b.onclick=fn;hs.appendChild(b);}
function fmt(n){return Number(n||0).toLocaleString("en-US");}
function renderStats(){
 document.getElementById("statPoints").textContent=fmt(BR.state.points);
 document.getElementById("statMarks").textContent=fmt(BR.state.marks);
 document.getElementById("statWeek").textContent=fmt(BR.state.weeklyPoints);
 const wrap=document.getElementById("checkpointDots");wrap.innerHTML='';
 const n=Math.min(7,Math.max(0,Number(BR.state.checkpoints)||0));
 for(let i=0;i<7;i++){const d=document.createElement('span');d.className='checkpoint-dot'+(i<n?' on':'');wrap.appendChild(d);}
}
renderStats();
add("left:2.5%;top:2.0%;width:18.5%;height:5.4%",()=>{BR.play("back");BR.go("screen03.html")},"back-hotspot");
add("left:51.0%;top:72.5%;width:46.5%;height:8.8%",()=>{BR.play("scan");BR.go("screen05.html")});
add("left:51.0%;top:82.2%;width:20.0%;height:7.5%",()=>BR.play("tap"));
add("left:71.0%;top:82.2%;width:26.0%;height:7.5%",()=>BR.play("tap"));
BR.preload("./assets/screen05-scanner.png");
</script></body></html>
