<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>BARAMEEL RUN — Run</title><link rel="stylesheet" href="./styles.css"></head>
<body><main class="stage" style="--ratio:.5714;--ar:948/1659">
<img id="art" class="base art-ready" alt="BARAMEEL RUN run mode" fetchpriority="high" decoding="async">
<div id="runStats" class="run-stats" aria-live="polite">
  <div id="statPoints" class="run-stat points"></div>
  <div id="statMarks" class="run-stat marks"></div>
  <div id="statWeekly" class="run-stat weekly"></div>
  <div id="statCheckpoints" class="checkpoint-dots"></div>
</div>
<div id="hotspots"></div></main>
<script src="./app.js"></script><script>
const c=BR.selected(), art=document.getElementById("art"), hs=document.getElementById("hotspots");
art.src=`./assets/screen04-${c}.png`;
function add(css,fn,cls=""){const b=document.createElement("button");b.className="hotspot "+cls;b.style.cssText=css;b.onclick=fn;hs.appendChild(b);}
function renderStats(){
 document.getElementById('statPoints').textContent=Number(BR.state.points||0).toLocaleString();
 document.getElementById('statMarks').textContent=Number(BR.state.marks||0).toLocaleString();
 document.getElementById('statWeekly').textContent=Number(BR.state.weeklyPoints||0).toLocaleString();
 const wrap=document.getElementById('statCheckpoints');wrap.innerHTML='';
 const total=7, got=Math.min(total,Number(BR.state.checkpoints||0));
 for(let i=0;i<total;i++){const d=document.createElement('span');d.className='checkpoint-dot'+(i<got?' on':'');wrap.appendChild(d);}
}
add("left:2.5%;top:2.0%;width:18.5%;height:5.4%",()=>{BR.play("back");BR.go("screen03.html")},"back-hotspot");
add("left:51.0%;top:72.5%;width:46.5%;height:8.8%",()=>{BR.play("scan");BR.go("screen05.html")});
add("left:51.0%;top:82.2%;width:20.0%;height:7.5%",()=>BR.play("tap"));
add("left:71.0%;top:82.2%;width:26.0%;height:7.5%",()=>BR.play("tap"));
renderStats();
</script></body></html>
