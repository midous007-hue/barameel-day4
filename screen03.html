<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Runner Confirmed</title><link rel="stylesheet" href="styles.css"></head><body><main class="app"><section class="screen"><img id="art" class="art" alt="Runner Confirmed"><button id="back" class="hit" aria-label="Back"></button><button id="run" class="hit" aria-label="Let's Run"></button><div class="flash" id="flash"></div></section></main><script src="app.js"></script><script>
const files={brona:'screen03-brona.png',chiller:'screen03-chiller.png',dreamer:'screen03-dreamer.png',racer:'screen03-racer.png',rookie:'screen03-rookie.png',skater:'screen03-skater.png'};

const back=document.getElementById('back'),run=document.getElementById('run');back.style.cssText='left:3%;top:2%;width:20%;height:7%';run.style.cssText='left:49%;top:68%;width:44%;height:12%';
