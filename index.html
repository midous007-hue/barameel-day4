<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>BARAMEEL RUN</title><link rel="stylesheet" href="./styles.css"></head>
<body><main class="stage" style="--ratio:.5641;--ar:942/1670"><img id="art" class="base" src="./assets/screen01-start.webp" alt="BARAMEEL RUN" decoding="async" fetchpriority="high"><input id="nickname" class="nickname-input" maxlength="24" autocomplete="nickname" autocapitalize="words" spellcheck="false" placeholder="TYPE YOUR NICKNAME" aria-label="Nickname"><button id="start" class="hotspot" aria-label="Start Run"></button></main>
<script src="./app.js"></script><script>
const input=document.getElementById("nickname"),start=document.getElementById("start");
input.value=BR.state.nickname||"";
input.addEventListener("input",()=>BR.setNickname(input.value));
start.onclick=()=>{if(!input.value.trim()){input.focus();BR.play("error");return;}BR.setNickname(input.value);BR.play("confirm");BR.go("screen02.html");};
</script></body></html>
