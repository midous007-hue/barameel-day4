<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#071f28"><title>BARAMEEL RUN</title><link rel="stylesheet" href="styles.css"></head><body><main class="app"><section class="screen"><img class="art" src="assets/screen01-start.png" alt="BARAMEEL RUN — Start"><input id="nickname" class="nick-input" maxlength="24" autocomplete="nickname" aria-label="Nickname"><button id="start" class="hit" aria-label="Start Run"></button></section></main><script src="app.js"></script><script>
const n=document.getElementById('nickname'),start=document.getElementById('start');
n.value=BARAMEEL.state.nickname||''; if(n.value)n.classList.add('has-value');
n.addEventListener('input',()=>{n.classList.toggle('has-value',!!n.value);});
n.addEventListener('focus',()=>{if(n.value)n.classList.add('has-value');});
start.style.cssText='left:11%;top:86.8%;width:78%;height:9.8%';
start.onclick=()=>{BARAMEEL.setNickname(n.value);if(!BARAMEEL.state.nickname){BARAMEEL.play('error');n.focus();return}BARAMEEL.play('confirm');location.href='screen02.html'};
n.addEventListener('keydown',e=>{if(e.key==='Enter')start.click()});
</script></body></html>
