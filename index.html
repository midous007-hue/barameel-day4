<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>BARAMEEL RUN</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="app"><section class="screen" id="screen">
<img class="art" src="assets/screen01-start.png" alt="">
<input id="nickname" class="nick-input" maxlength="24" autocomplete="nickname" aria-label="Nickname">
<button id="start" class="hit" aria-label="Start Run"></button>
<div class="flash" id="flash"></div><div class="toast" id="toast"></div>
</section></main>
<script src="app.js"></script><script>
const s=document.getElementById('screen'), n=document.getElementById('nickname');
n.style.left='13%'; n.style.top='78.7%'; n.style.width='74%'; n.style.height='7.2%';
document.getElementById('start').style.cssText='left:11%;top:87%;width:78%;height:9%';
n.value=BARAMEEL.state.nickname;
document.getElementById('start').onclick=()=>{BARAMEEL.setNickname(n.value); if(!BARAMEEL.state.nickname){n.focus();BARAMEEL.play('error');return} BARAMEEL.play('confirm'); location.href='screen02.html'};
n.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('start').click()});
</script></body></html>
